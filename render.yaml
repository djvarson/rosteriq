# Render.com Blueprint — alternative to Railway
# Deploy: connect repo in Render dashboard, it auto-detects this file

services:
  - type: web
    name: rosteriq-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rosteriq-db
          property: connectionString
      - key: TANDA_CLIENT_ID
        sync: false
      - key: TANDA_CLIENT_SECRET
        sync: false
      - key: TANDA_REDIRECT_URI
        value: https://api.rosteriq.com.au/tanda/callback
    healthCheckPath: /health

  - type: web
    name: rosteriq-dashboard
    runtime: static
    buildCommand: echo "Static site"
    staticPublishPath: ./dashboard
    routes:
      - type: rewrite
        source: /api/*
        destination: https://rosteriq-api.onrender.com/*

databases:
  - name: rosteriq-db
    plan: starter
    databaseName: rosteriq
    postgresMajorVersion: 16
    ipAllowList: []
