<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/static/logo-icon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set a new password — RosterIQ</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
  <style>
    :root {
      --page: #F5F3EF; --card: #FFFFFF; --ink: #111827; --muted: #6B7280;
      --border: #E8E4DC; --amber: #F59E0B; --deep: #B45309; --danger: #DC2626; --success: #15803D;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--page); color: var(--ink); letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility;
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 36px 32px; width: 100%; max-width: 420px;
    }
    .logo { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 22px; }
    .logo span { color: var(--amber); }
    h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 6px; }
    .sub { color: var(--muted); font-size: 14px; margin-bottom: 22px; }
    label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.5px;
            text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; }
    input {
      width: 100%; font: inherit; font-size: 15px; padding: 11px 12px;
      border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--ink);
    }
    input:focus { outline: none; border-color: var(--amber); box-shadow: 0 0 0 3px rgba(245,158,11,0.15); }
    button {
      width: 100%; margin-top: 20px; font: inherit; font-size: 15px; font-weight: 700;
      background: var(--amber); color: var(--ink); border: none; border-radius: 8px;
      padding: 12px; cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    .msg { margin-top: 14px; font-size: 13px; display: none; }
    .msg.err { color: var(--danger); display: block; }
    .msg.ok { color: var(--success); display: block; font-weight: 600; }
    a { color: var(--deep); font-weight: 600; }
    .backlink { margin-top: 18px; font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Roster<span>IQ</span></div>
    <h1>Set a new password</h1>
    <p class="sub">This link works once and expires an hour after it was made.</p>
    <form id="f">
      <label for="pw">New password</label>
      <input type="password" id="pw" minlength="8" autocomplete="new-password" required>
      <label for="pw2">Type it again</label>
      <input type="password" id="pw2" minlength="8" autocomplete="new-password" required>
      <button type="submit" id="go">Set password</button>
    </form>
    <div class="msg" id="msg"></div>
    <div class="backlink"><a href="/login">Back to sign in</a></div>
  </div>
  <script>
    const token = new URLSearchParams(location.search).get('token') || '';
    const msg = document.getElementById('msg');
    function show(text, cls) { msg.textContent = text; msg.className = 'msg ' + cls; }
    if (!token) show('This link is missing its token — ask for a fresh one.', 'err');
    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw = document.getElementById('pw').value, pw2 = document.getElementById('pw2').value;
      if (pw !== pw2) { show('Those two don’t match.', 'err'); return; }
      if (pw.length < 8) { show('At least 8 characters.', 'err'); return; }
      const btn = document.getElementById('go');
      btn.disabled = true;
      try {
        const r = await fetch('/api/auth/reset-password', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: token, new_password: pw }),
        });
        const d = await r.json().catch(() => ({}));
        if (r.ok) {
          show('Done — sign in with your new password.', 'ok');
          document.getElementById('f').style.display = 'none';
          setTimeout(() => { location.href = '/login'; }, 1800);
        } else {
          show((d.detail || (d.error || {}).message || 'That link has expired or was already used') +
               ' — ask your manager for a fresh one.', 'err');
          btn.disabled = false;
        }
      } catch (err) {
        show('Network hiccup — try again.', 'err');
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
