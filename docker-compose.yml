version: "3.9"

services:
  # PostgreSQL database
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rosteriq
      POSTGRES_USER: rosteriq
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rosteriq_dev_2026}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Schema is created by the migration runner (see api service command),
      # NOT by mounting schema.sql here — that snapshot has drifted and is
      # missing the v3 tables. Migrations are the single source of truth.
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rosteriq"]
      interval: 5s
      timeout: 3s
      retries: 10

  # RosterIQ API server
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://rosteriq:${DB_PASSWORD:-rosteriq_dev_2026}@db:5432/rosteriq
      ROSTERIQ_ENV: production
      CORS_ORIGINS: http://localhost:3000,http://localhost:8080
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Project root holds the package contents (imported as rosteriq.*), which
      # the image places at /app/rosteriq. Mount the root there for live reload.
      - .:/app/rosteriq:ro
    command: >
      sh -c "python -m rosteriq.migrations.run_migrations --run &&
      exec uvicorn rosteriq.api:app
      --host 0.0.0.0
      --port 8000
      --reload
      --log-level info"

  # Dashboard (served via nginx)
  dashboard:
    image: nginx:alpine
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
