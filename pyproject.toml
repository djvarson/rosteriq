[project]
name = "rosteriq"
version = "0.1.0"
description = "RosterIQ — AI-powered predictive rostering for Australian hospitality venues"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "xgboost>=2.0",
    "prophet>=1.1",
    "httpx>=0.25",
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "respx>=0.20",
]

[project.scripts]
rosteriq = "rosteriq.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
